<!DOCTYPE html>
<html>
<head>
  <title>hi</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mpcss.css"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>

<!-- 1 -->
 <div class="container">
    <div class="row">
        <div class="col-10 col-md-6">
<div class="card">
  <div class="card-header text-bg-primary mb-3">
    <h2>Tip Calculator</h2>
  </div>
  <div class="card-body">
    <form>
          <label for="subtotal">Subtotal ($)</label><br>
  <input type="text" id="subtotal" name="subtotal"><br>
  <label for="percentage">Tip Percentage (as decimal, e.g. 0.2)</label><br>
  <input type="text" id="percentage" name="percentage"><br>

      <button type="button" class="btn btn-primary" id="calcTip" onclick="calculateTip()">Calculate Tip</button>
    </form>
    
     <div class="card-footer">
  
    <p>Tip Amount: <span id="tipAmt">--</span></p>
    <br>
    <p>Total Bill: <span id="bill">--</span></p>
  </div>
  </div>
</div>
<!-- 2 -->
        </div>
        <div class="col-10 col-md-6">
<div class="container">
    <div class="card">
  <div class="card-header text-bg-success mb-3">
    <h2>Paycheck Calculator</h2>
  </div>
  <div class="card-body">
    <form>
    <label for="hours">Hours Worked</label><br>
  <input type="text" id="hours" name="hours"><br>
  <label for="rate">Hourly Rate ($)</label><br>
  <input type="text" id="rate" name="rate">
  <br>
      <button type="button"   class="btn btn-success" id="calcPay">Calculate Paycheck</button>
    </form>
    
     <div class="card-footer">
    <span>Paycheck Amount: <span id="check">--</span></span>
  </div>
  </div>
</div></div>
        </div>
    </div>
<!-- 3 -->
    <div class="row">
        <div class="col-10 col-md-6">
             <div class="container">
    <div class="card">
  <div class="card-header text-bg-warning mb-3">
    <h2>Grade Calculator</h2>
  </div>
  <div class="card-body">
    <form>
          <label for="earned">Points Earned</label><br>
  <input type="text" id="earned" name="earned"><br>
  <label for="total">Total Points</label><br>
  <input type="text" id="total" name="total">
      <button type="button"   class="btn btn-warning" id="calcGrade">Calculate Grade</button>

    </form>
    <!-- <h5 class="card-title">Special title treatment</h5>
    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p> -->
    <!-- <br>
    <br> -->
     <div class="card-footer">
    <span>Your Grade: <span id="grade">--</span></span>
  </div>
  </div>
</div>
</div>

        </div>
<!-- 4 -->
        <div class="col-10 col-md-6">
              <div class="container">
    <div class="card">
  <div class="card-header text-bg-danger mb-3">
    <h2>Gas Cost Calculator</h2>
  </div>
  <div class="card-body">
    <form>
          <label for="size">Tank Size (gallons)</label><br>
  <input type="text" id="size" name="size"><br>
  <label for="price">Price per Gallon ($)</label><br>
  <input type="text" id="price" name="price">
  <button type="button"   class="btn btn-danger" id="calcGas">Calculate Gas Cost</button>
    </form>
    <!-- <h5 class="card-title">Special title treatment</h5>
    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p> -->
    <!-- <br>
    
    <br> -->
     <div class="card-footer">
    <span>Cost to Fill: <span id="fillCost">--</span></span>
  </div>
  </div>
</div>
</div>
        </div>
    </div>
 </div>

    <script src="mpjs.js"></script>
  </body>
